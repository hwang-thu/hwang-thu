<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我们的备婚手册</title><style>html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#f6f1ed;color:#2f2926}.loading{height:100%;display:grid;place-items:center;text-align:center}.card{padding:28px 32px;background:#fffdfb;border:1px solid #e8ddd6;border-radius:18px;box-shadow:0 14px 40px rgba(66,45,37,.08)}.heart{font-size:30px;color:#a75f65}.bar{width:220px;height:6px;background:#eadfda;border-radius:99px;overflow:hidden;margin:18px auto 0}.bar:after{content:"";display:block;width:45%;height:100%;background:#a75f65;border-radius:inherit;animation:move 1.1s infinite alternate ease-in-out}@keyframes move{to{transform:translateX(120%)}}</style></head><body><div class="loading"><div class="card"><div class="heart">囍</div><h2>正在打开备婚手册</h2><div>首次加载可能需要几秒钟</div><div class="bar"></div></div></div><script>(async()=>{try{const files=["part-00.txt","part-01.txt","part-02.txt","part-03.txt","part-04.txt","part-05.txt","part-06.txt"];const texts=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const s=texts.join('');const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('browser');const stream=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div class="card"><h2>页面加载失败</h2><p>请使用最新版 Chrome、Edge 或 Safari 浏览器重试。</p></div></div>'}})();</script></body></html>
